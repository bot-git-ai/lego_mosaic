[package]
name = "lego-mosaic"
version = "0.3.0"
edition = "2021"
description = "Private, browser-side LEGO mosaic design in Rust"

[lib]
name = "lego_mosaic"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "lego-mosaic"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = [
  "Window", "Document", "Element", "Node", "NodeList", "EventTarget", "Event", "MouseEvent",
  "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlButtonElement", "HtmlAnchorElement",
  "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "ImageBitmap",
  "File", "FileList", "Blob", "BlobPropertyBag", "Url", "DragEvent", "DataTransfer", "DomTokenList",
  "CssStyleDeclaration", "HtmlCollection", "HtmlFieldSetElement", "Performance", "console"
] }

[lints.rust]
warnings = "deny"

[profile.release]
strip = true
lto = true
opt-level = "s"
