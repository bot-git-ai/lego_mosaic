[package]
name = "lego-mosaic"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Private, browser-side LEGO mosaic design in Rust"

[lib]
name = "lego_mosaic"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "lego-mosaic"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = [
  "Navigator", "ServiceWorkerContainer", "ServiceWorker", "ServiceWorkerRegistration", "RegistrationOptions", "Location", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "DedicatedWorkerGlobalScope", "Window", "Document", "Element", "Node", "NodeList", "EventTarget", "Event", "MouseEvent",
  "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlButtonElement", "HtmlAnchorElement",
  "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "ImageBitmap",
  "File", "FileList", "Blob", "BlobPropertyBag", "Url", "DragEvent", "DataTransfer", "DomTokenList", "PointerEvent", "WheelEvent", "KeyboardEvent", "DomRect", "DomRectReadOnly",
  "CssStyleDeclaration", "HtmlCollection", "HtmlFieldSetElement", "Performance", "console"
] }

[lints.rust]
warnings = "deny"

# Rasterize the install icons from `assets/icon.svg` in `build.rs`. The SVG is
# the committed icon; these are build output.
[build-dependencies]
usvg = { version = "0.48", default-features = false }
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
